<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero — Plataforma de Apoyo Académico</title>

<style>
:root {
  --bg: #f5f5f3;
  --col-bg: #eceae5;
  --card-bg: #ffffff;
  --text: #1f2328;
  --text-muted: #62697a;
  --border: #ddd9d0;
  --accent: #6b4fbb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding: 20px;
}

header {
  max-width: 1200px;
  margin: 0 auto 20px;
}

.board {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  overflow-x: auto;
}

.column {
  background: var(--col-bg);
  border-radius: 12px;
  padding: 10px;
  min-width: 220px;
  flex: 1;
}

.column h2 {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.cardlist {
  min-height: 50px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: grab;
}

.code {
  font-weight: bold;
}

.prio {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
}

.prio-alta { background:#fde2e1; color:#b3261e; }
.prio-media { background:#fdf1d6; color:#96650a; }
.prio-baja { background:#dff3e0; color:#256b32; }
.prio-confirmar { background:#ece3fb; color:#6b4fbb; }

.column.dragover {
  outline: 2px dashed var(--accent);
}
</style>
</head>

<body>

<header>
  <h1>🗂️ Plataforma de Apoyo Académico — Tablero de gestión</h1>
  <p>Arrastra las tarjetas entre columnas para actualizar el estado.</p>
</header>

<div class="board" id="board"></div>

<script>
const COLUMNS = [
  { key: "backlog", label: "Backlog" },
  { key: "todo", label: "Por hacer" },
  { key: "progress", label: "En progreso" },
  { key: "review", label: "En revisión" },
  { key: "done", label: "Hecho" }
];

const PRIO_LABEL = {
  alta: "Alta",
  media: "Media",
  baja: "Baja",
  confirmar: "Por confirmar"
};

let state = [
  {
    id:"rf01",
    code:"RF-01",
    name:"Registro de usuario",
    priority:"alta",
    column:"progress"
  },
  {
    id:"rf02",
    code:"RF-02",
    name:"Inicio y cierre de sesión",
    priority:"alta",
    column:"progress"
  },
  {
    id:"rf03",
    code:"RF-03",
    name:"Búsqueda de material por asignatura",
    priority:"alta",
    column:"todo"
  },
  {
    id:"rnf01",
    code:"RNF-01",
    name:"Seguridad de credenciales",
    priority:"alta",
    column:"todo"
  }
];

const boardEl = document.getElementById("board");

function renderBoard() {
  boardEl.innerHTML = "";

  COLUMNS.forEach(col => {

    const cards = state.filter(c => c.column === col.key);

    const colEl = document.createElement("div");
    colEl.className = "column";

    colEl.innerHTML =
      `<h2>${col.label} <span>${cards.length}</span></h2>`;

    const listEl = document.createElement("div");
    listEl.className = "cardlist";

    cards.forEach(card => {

      const cardEl = document.createElement("div");
      cardEl.className = "card";
      cardEl.draggable = true;
      cardEl.dataset.id = card.id;

      cardEl.innerHTML = `
        <div class="code">${card.code}</div>
        <div>${card.name}</div>
        <span class="prio prio-${card.priority}">
          ${PRIO_LABEL[card.priority]}
        </span>
      `;

      cardEl.addEventListener("dragstart", () => {
        cardEl.classList.add("dragging");
      });

      cardEl.addEventListener("dragend", () => {
        cardEl.classList.remove("dragging");
      });

      listEl.appendChild(cardEl);
    });

    colEl.appendChild(listEl);

    colEl.addEventListener("dragover", e => {
      e.preventDefault();
      colEl.classList.add("dragover");
    });

    colEl.addEventListener("dragleave", () => {
      colEl.classList.remove("dragover");
    });

    colEl.addEventListener("drop", e => {
      e.preventDefault();
      colEl.classList.remove("dragover");

      const dragging = document.querySelector(".dragging");
      if (!dragging) return;

      const card = state.find(
        c => c.id === dragging.dataset.id
      );

      if (card) {
        card.column = col.key;
        renderBoard();
      }
    });

    boardEl.appendChild(colEl);
  });
}

renderBoard();
</script>

</body>
</html>
