name: plataforma_apoyo_academico
description: >
  Plataforma de Apoyo Académico — cliente Flutter Web.
  Proyecto de aula, curso de Ingeniería de Software.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1                # llamadas al Backend API (docs/diagramas/05-componentes.png)
  provider: ^6.1.2            # estado de sesión (usuario autenticado / token)
  intl: ^0.19.0                # formato de fechas
  file_picker: ^8.0.0+1        # RF-06: seleccionar el archivo a subir (compatible con Web)
  shared_preferences: ^2.2.3   # persistir el token JWT entre recargas del navegador
  url_launcher: ^6.2.6          # RF-05: abrir/descargar el archivo del material

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
